version: '3.9'
services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: nodejs-app
    ports:
      - "8080:8080"
    expose:
      - "8081"
    depends_on:
      - mongo_db 
    networks:
      - mongo-network  
  frontend:
    container_name: react-frontend
    image: frontend-app
    ports:
      - "3000:80"
    expose:
      - "3000"
    depends_on:
      - backend 
    networks:
      - mongo-network  
  mongo_db:
    container_name: mongo_order_delivery
    image: mongo:latest
    restart: always
    ports:
      - 27017:27017
    expose:
      - "27017"
    volumes:
      - mongo_db:/data/db
    networks:
      - mongo-network
  mongo-express:
    image: mongo-express
    container_name: mongo-express_order_delivery
    restart: always
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo_db
      ME_CONFIG_MONOGODB_USERNAME: admin
      ME_CONFIG_MONOGODB_PASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongo_db:27017/
    ports:
      - "8081:8081"
    expose:
      - "8081"
    networks:
      - mongo-network

networks:
  mongo-network:
    driver: bridge

volumes:
  mongo_db:
